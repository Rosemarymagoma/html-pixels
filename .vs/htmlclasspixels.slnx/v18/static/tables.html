<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Tables in Html</h1>
    <p>Tables are used to display data in a tabular format.</p>
    <table>
        <tr>
            <th>Country</th>
            <th>Capital</th>
            <th>Population</th>
        </tr>
        <tr>
            <td>Kenya</td>
            <td>Nairobi</td>
            <td>45 Million</td>
        </tr>
        <tr>
            <td>Uganda</td>
            <td>Kampala</td>
            <td>45 Million</td>
        </tr>
    </table>
</body>
</html>
